name: Mirror to Gitee

on:
  push:
  schedule:
    - cron: "17 */2 * * *"  # incremental, every 2 hours (unchanged cadence, off the :00 mark)
    - cron: "53 19 * * *"   # daily full sync (03:53 Asia/Shanghai) -- re-verifies every repo against Gitee and self-heals any state drift left by an incremental run
  workflow_dispatch:
    inputs:
      full:
        description: 'Force a full sync (ignore the state file for skip decisions)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 129+ 个仓库全量 force-push 镜像，个别大仓库单仓库重试三次就要吃掉较长时间；
    # 全量档留够余量，增量档大部分仓库会被 state 文件短路，不需要这么久。
    timeout-minutes: ${{ github.event.schedule == '53 19 * * *' && 180 || 60 }}
    steps:
      - uses: actions/checkout@v4

      - name: List farfarfun's public repos, excluding the huge chinese-poetry fork
        id: repos
        env:
          GH_TOKEN: ${{ secrets.ACTION_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # chinese-poetry 是 fork 来的第三方数据集（~237MB，非 farfarfun 原创
          # 内容），push 到 Gitee 经常单次超时，直接排除。
          # 用带 token 的 orgs/.../repos?type=public 而不是匿名 API：匿名 60
          # 次/小时的额度对 129+ 个仓库的逐仓库校验远远不够；type=public 保证
          # 即使 token 能看到私有仓库，也不会被列进来同步到 Gitee。
          names=$(gh api "orgs/farfarfun/repos" --method GET -f type=public --paginate --jq '.[].name' \
            | grep -vx 'chinese-poetry' | paste -sd, -)
          echo "repo-names=$names" >> "$GITHUB_OUTPUT"

      - name: Decide incremental vs full sync
        id: mode
        run: |
          full="${{ github.event.schedule == '53 19 * * *' || inputs.full == true }}"
          if [[ "$full" == "true" ]]; then
            echo "incremental=false" >> "$GITHUB_OUTPUT"
            echo "workers=2" >> "$GITHUB_OUTPUT"
          else
            echo "incremental=true" >> "$GITHUB_OUTPUT"
            # Gitee API 在 8 路并发时偶发整仓库请求超时；降低并发换稳定性。
            echo "workers=4" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror farfarfun public repositories to Gitee
        if: always() && steps.repos.outputs.repo-names != ''
        uses: farfarfun-action/mirror-repo@v1
        env:
          PYTHONUNBUFFERED: "1"
        with:
          src: github/farfarfun
          dst: gitee/farfarfun
          src_token: ${{ secrets.ACTION_GITHUB_TOKEN }}
          dst_key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          repo-names: ${{ steps.repos.outputs.repo-names }}
          state-file: .mirror-state/gitee.json
          incremental: ${{ steps.mode.outputs.incremental }}
          workers: ${{ steps.mode.outputs.workers }}

      # Committed to this repo so it survives across runs (runners are
      # ephemeral); "[skip ci]" stops this from re-triggering the `on: push`
      # trigger above.
      - name: Persist mirror state
        if: always()
        run: |
          [[ -f .mirror-state/gitee.json ]] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .mirror-state/gitee.json
          git diff --cached --quiet || git commit -m 'chore: update Gitee mirror state [skip ci]'

          # github.sha (and thus this checkout) is resolved at trigger time,
          # not run-start time, so an overlapping run can leave main ahead of
          # what we checked out even after the concurrency group serializes
          # execution. The state file is regenerated fresh each run rather
          # than diff-applied, so preferring "ours" on conflict is safe --
          # any staleness self-heals on the next full sync.
          for i in 1 2 3 4 5; do
            git push && break
            [[ $i -eq 5 ]] && exit 1
            git fetch origin main
            git rebase -X ours origin/main
          done
